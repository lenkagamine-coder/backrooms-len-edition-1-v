<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backrooms Len Edition</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

canvas{
    display:block;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    background:rgba(0,0,0,0.5);
    padding:12px;
    border:1px solid #ffe082;
    border-radius:8px;
    z-index:10;
}

#crosshair{
    position:absolute;
    top:50%;
    left:50%;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    transform:translate(-50%,-50%);
    z-index:5;
}

#vhs{
    position:absolute;
    inset:0;
    pointer-events:none;
    mix-blend-mode:screen;
    opacity:0.08;
    background:
    repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 2px,
        transparent 2px,
        transparent 4px
    );
}

#staminaWrap{
    width:200px;
    height:10px;
    background:#222;
    margin-top:8px;
}

#stamina{
    width:100%;
    height:100%;
    background:#ffe082;
}

</style>

<!-- ESTA ES LA PARTE IMPORTANTE -->
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

</head>
<body>

<div id="hud">

BACKROOMS LEN EDITION<br>
WASD = mover<br>
SHIFT = correr<br>
CLICK = capturar mouse<br>
ESC = liberar mouse<br>
F = celular

<div id="staminaWrap">
<div id="stamina"></div>
</div>

</div>

<div id="crosshair"></div>
<div id="vhs"></div>

<script>

// =====================================
// ESCENA
// =====================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x66551f);

scene.fog = new THREE.FogExp2(
0x66551f,
0.02
);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
renderer.domElement
);

// =====================================
// VHS
// =====================================

const vhs = document.getElementById("vhs");

setInterval(()=>{

vhs.style.opacity =
0.05 + Math.random()*0.04;

},120);

// =====================================
// PLAYER
// =====================================

const player = {
x:0,
z:0,
radius:1
};

// =====================================
// LEN
// =====================================

const len = new THREE.Group();

const body = new THREE.Mesh(

new THREE.BoxGeometry(1,1.5,0.6),

new THREE.MeshStandardMaterial({
color:0xffffff
})
);

body.position.y = 1.6;

len.add(body);

const head = new THREE.Mesh(

new THREE.BoxGeometry(0.9,0.9,0.9),

new THREE.MeshStandardMaterial({
color:0xffd8b5
})
);

head.position.y = 2.8;

len.add(head);

const hair = new THREE.Mesh(

new THREE.BoxGeometry(1,0.5,1),

new THREE.MeshStandardMaterial({
color:0xf2cf4a
})
);

hair.position.y = 3.2;

len.add(hair);

scene.add(len);

// =====================================
// PISO
// =====================================

const floor = new THREE.Mesh(

new THREE.PlaneGeometry(4000,4000),

new THREE.MeshStandardMaterial({
color:0x7d6228
})
);

floor.rotation.x = -Math.PI/2;

scene.add(floor);

// =====================================
// TECHO
// =====================================

const ceiling = new THREE.Mesh(

new THREE.PlaneGeometry(4000,4000),

new THREE.MeshStandardMaterial({
color:0xded7b8
})
);

ceiling.rotation.x = Math.PI/2;
ceiling.position.y = 6;

scene.add(ceiling);

// =====================================
// LUCES
// =====================================

scene.add(
new THREE.AmbientLight(
0xffffff,
0.18
)
);

const lights = [];

function addLight(x,z){

const light = new THREE.PointLight(
0xfff2cc,
1,
18
);

light.position.set(x,5.7,z);

scene.add(light);

lights.push(light);
}

// =====================================
// CHUNKS
// =====================================

const chunkSize = 60;
const chunks = {};

function createWall(x,y,z,w,h,d,group){

const wall = new THREE.Mesh(

new THREE.BoxGeometry(w,h,d),

new THREE.MeshStandardMaterial({
color:0xb69a4d
})
);

wall.position.set(x,y,z);

wall.userData = {
w:w,
d:d
};

scene.add(wall);

group.add(wall);

return wall;
}

function generateChunk(cx,cz){

const key = `${cx},${cz}`;

if(chunks[key]) return;

const group = new THREE.Group();

group.userData.walls = [];

chunks[key] = group;

const bx = cx * chunkSize;
const bz = cz * chunkSize;

// paredes

for(let i=0;i<12;i++){

const horizontal =
Math.random()>0.5;

const wall = createWall(

bx + (Math.random()-0.5)*chunkSize,
3,
bz + (Math.random()-0.5)*chunkSize,

horizontal ? 24 : 2,
6,
horizontal ? 2 : 24,

group
);

group.userData.walls.push(wall);
}

// columnas

for(let i=0;i<4;i++){

const column = new THREE.Mesh(

new THREE.BoxGeometry(4,6,4),

new THREE.MeshStandardMaterial({
color:0x9b8137
})
);

column.position.set(

bx + (Math.random()-0.5)*chunkSize,
3,
bz + (Math.random()-0.5)*chunkSize

);

column.userData = {
w:4,
d:4
};

scene.add(column);

group.add(column);

group.userData.walls.push(column);
}

// luces

for(let i=0;i<3;i++){

addLight(

bx + (Math.random()-0.5)*chunkSize,
bz + (Math.random()-0.5)*chunkSize

);
}
}

// =====================================
// ELIMINAR CHUNKS
// =====================================

function unloadFarChunks(px,pz){

for(const key in chunks){

const [cx,cz] =
key.split(",").map(Number);

const dx = cx - px;
const dz = cz - pz;

if(Math.abs(dx)>2 ||
Math.abs(dz)>2){

const group = chunks[key];

group.traverse(obj=>{

scene.remove(obj);

if(obj.geometry)
obj.geometry.dispose();

if(obj.material){

if(Array.isArray(obj.material)){

obj.material.forEach(
m=>m.dispose()
);
}
else{
obj.material.dispose();
}
}
});

delete chunks[key];
}
}
}

// =====================================
// CONTROLES
// =====================================

const keys = {};

window.addEventListener("keydown",e=>{

keys[e.key.toLowerCase()] = true;

});

window.addEventListener("keyup",e=>{

keys[e.key.toLowerCase()] = false;

});

// =====================================
// MOUSE LOOK
// =====================================

let yaw = 0;
let pitch = 0;

renderer.domElement.addEventListener(
"click",
()=>{

renderer.domElement.requestPointerLock();

});

window.addEventListener(
"mousemove",
e=>{

if(document.pointerLockElement
=== renderer.domElement){

yaw -= e.movementX * 0.002;

pitch -= e.movementY * 0.002;

pitch = Math.max(
-1,
Math.min(1,pitch)
);
}
});

// =====================================
// STAMINA
// =====================================

let stamina = 100;

const staminaBar =
document.getElementById("stamina");

// =====================================
// LINTERNA
// =====================================

let flashlightOn = true;

const flashlight =
new THREE.SpotLight(
0xffffff,
2.5,
25,
Math.PI/8,
0.4
);

scene.add(flashlight);
scene.add(flashlight.target);

window.addEventListener(
"keydown",
e=>{

if(e.key.toLowerCase()==="f"){

flashlightOn = !flashlightOn;

flashlight.visible =
flashlightOn;
}
});

// =====================================
// BACTERIA
// =====================================

const bacteria = new THREE.Group();

const core = new THREE.Mesh(

new THREE.SphereGeometry(1.5,10,10),

new THREE.MeshStandardMaterial({
color:0x090909
})
);

bacteria.add(core);

bacteria.position.set(25,4,25);

scene.add(bacteria);

// =====================================
// COLISIONES
// =====================================

function checkCollision(x,z){

for(const key in chunks){

const walls =
chunks[key].userData.walls;

for(const wall of walls){

const dx =
Math.abs(x - wall.position.x);

const dz =
Math.abs(z - wall.position.z);

const limitX =
wall.userData.w/2 +
player.radius;

const limitZ =
wall.userData.d/2 +
player.radius;

if(dx < limitX &&
dz < limitZ){

return true;
}
}
}

return false;
}

// =====================================
// UPDATE
// =====================================

function update(){

const currentChunkX =
Math.floor(player.x/chunkSize);

const currentChunkZ =
Math.floor(player.z/chunkSize);

for(let x=-1;x<=1;x++){

for(let z=-1;z<=1;z++){

generateChunk(
currentChunkX + x,
currentChunkZ + z
);
}
}

unloadFarChunks(
currentChunkX,
currentChunkZ
);

// movimiento

let speed = 0.08;

const moving =

keys["w"] ||
keys["a"] ||
keys["s"] ||
keys["d"];

if(keys["shift"] &&
stamina > 0 &&
moving){

speed = 0.14;

stamina -= 0.4;
}
else{

stamina += 0.25;
}

stamina = Math.max(
0,
Math.min(100,stamina)
);

staminaBar.style.width =
stamina + "%";

let mx = 0;
let mz = 0;

if(keys["w"]){

mx += Math.sin(yaw)*speed;
mz += Math.cos(yaw)*speed;
}

if(keys["s"]){

mx -= Math.sin(yaw)*speed;
mz -= Math.cos(yaw)*speed;
}

if(keys["a"]){

mx += Math.sin(
yaw + Math.PI/2
)*speed;

mz += Math.cos(
yaw + Math.PI/2
)*speed;
}

if(keys["d"]){

mx += Math.sin(
yaw - Math.PI/2
)*speed;

mz += Math.cos(
yaw - Math.PI/2
)*speed;
}

const nextX = player.x + mx;
const nextZ = player.z + mz;

if(!checkCollision(nextX,player.z)){

player.x = nextX;
}

if(!checkCollision(player.x,nextZ)){

player.z = nextZ;
}

// personaje

len.position.set(
player.x,
0,
player.z
);

len.rotation.y = yaw;

// cámara

const camX =
player.x - Math.sin(yaw)*5;

const camZ =
player.z - Math.cos(yaw)*5;

camera.position.x +=
(camX - camera.position.x)*0.08;

camera.position.z +=
(camZ - camera.position.z)*0.08;

camera.position.y +=
(3 - camera.position.y)*0.08;

camera.lookAt(
player.x,
2 + pitch,
player.z
);

// linterna

flashlight.position.copy(
camera.position
);

flashlight.target.position.set(

player.x + Math.sin(yaw)*10,
2,
player.z + Math.cos(yaw)*10
);

// bacteria

const dx =
player.x - bacteria.position.x;

const dz =
player.z - bacteria.position.z;

const dist =
Math.sqrt(dx*dx + dz*dz);

if(dist < 40){

bacteria.lookAt(
player.x,
4,
player.z
);

if(dist > 8){

bacteria.position.x +=
dx*0.0025;

bacteria.position.z +=
dz*0.0025;
}

if(dist < 15){

vhs.style.opacity =
0.15 + Math.random()*0.15;
}
}

// luces

for(const l of lights){

if(Math.random()<0.0015){

l.intensity =
Math.random()*0.4;
}
else{

l.intensity +=
(0.9 - l.intensity)*0.03;
}
}
}

// =====================================
// LOOP
// =====================================

function animate(){

requestAnimationFrame(animate);

update();

renderer.render(
scene,
camera
);
}

animate();

// =====================================
// RESIZE
// =====================================

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);
});

</script>

</body>
</html>
