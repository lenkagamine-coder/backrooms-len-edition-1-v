<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Backrooms Len Edition</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
}

canvas{
    display:block;
}

#hud{
    position:absolute;
    top:15px;
    left:15px;

    background:rgba(0,0,0,0.55);
    color:white;

    padding:14px;

    border:2px solid #f4d35e;
    border-radius:12px;

    z-index:20;

    backdrop-filter:blur(4px);
}

#title{
    font-size:28px;
    color:#ffe082;
    margin-bottom:8px;
}

#crosshair{
    position:absolute;

    top:50%;
    left:50%;

    width:6px;
    height:6px;

    background:white;
    border-radius:50%;

    transform:translate(-50%,-50%);

    z-index:10;
}

#vhs{

    position:absolute;
    inset:0;

    pointer-events:none;

    opacity:0.08;

    mix-blend-mode:screen;

    background:
    repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 2px,
        transparent 2px,
        transparent 4px
    );

    z-index:5;
}

#staminaWrap{
    width:220px;
    height:12px;

    background:#222;

    border-radius:999px;

    overflow:hidden;

    margin-top:8px;
}

#stamina{
    width:100%;
    height:100%;

    background:#ffe082;
}

#batteryWrap{
    width:220px;
    height:12px;

    background:#222;

    border-radius:999px;

    overflow:hidden;

    margin-top:8px;
}

#battery{
    width:100%;
    height:100%;

    background:#7cff8f;
}

</style>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

</head>
<body>

<div id="hud">

<div id="title">
BACKROOMS LEN EDITION
</div>

WASD = mover<br>
SHIFT = correr<br>
CLICK = capturar mouse<br>
ESC = liberar mouse<br>
F = celular

<div style="margin-top:12px;">
STAMINA
</div>

<div id="staminaWrap">
<div id="stamina"></div>
</div>

<div style="margin-top:10px;">
BATERÍA
</div>

<div id="batteryWrap">
<div id="battery"></div>
</div>

</div>

<div id="crosshair"></div>
<div id="vhs"></div>

<script>

// =====================================
// ESCENA
// =====================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x5e4b16);

scene.fog = new THREE.FogExp2(
0x5e4b16,
0.018
);

// =====================================
// CÁMARA
// =====================================

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

// =====================================
// RENDERER
// =====================================

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

document.body.appendChild(
renderer.domElement
);

// =====================================
// VHS
// =====================================

const vhs =
document.getElementById("vhs");

setInterval(()=>{

vhs.style.opacity =
0.05 + Math.random()*0.05;

},100);

// =====================================
// PLAYER
// =====================================

const player = {

x:0,
y:0,
z:0,

radius:1
};

// =====================================
// LEN LOWPOLY N64
// =====================================

const len = new THREE.Group();

// cuerpo

const body = new THREE.Mesh(

new THREE.BoxGeometry(
1.1,
1.5,
0.7
),

new THREE.MeshStandardMaterial({
color:0xffffff
})
);

body.position.y = 1.5;

body.castShadow = true;

len.add(body);

// cabeza

const head = new THREE.Mesh(

new THREE.BoxGeometry(
1,
1,
1
),

new THREE.MeshStandardMaterial({
color:0xffddb5
})
);

head.position.y = 2.7;

head.castShadow = true;

len.add(head);

// cabello principal

for(let i=0;i<8;i++){

const hairSpike = new THREE.Mesh(

new THREE.ConeGeometry(
0.22,
0.7,
4
),

new THREE.MeshStandardMaterial({
color:0xffea00
})
);

hairSpike.position.y = 3.15;

const angle =
(i/8) * Math.PI * 2;

hairSpike.position.x =
Math.cos(angle)*0.45;

hairSpike.position.z =
Math.sin(angle)*0.45;

hairSpike.rotation.z =
Math.random()*0.6;

hairSpike.rotation.x =
Math.random()*0.6;

len.add(hairSpike);
}

// flequillo

for(let i=0;i<3;i++){

const bang = new THREE.Mesh(

new THREE.ConeGeometry(
0.18,
0.6,
4
),

new THREE.MeshStandardMaterial({
color:0xffea00
})
);

bang.position.set(
-0.25 + i*0.25,
2.95,
0.45
);

bang.rotation.x = 1.5;

len.add(bang);
}

// ojos

const eyeMat =
new THREE.MeshBasicMaterial({
color:0x68e7ff
});

const leftEye = new THREE.Mesh(

new THREE.PlaneGeometry(
0.12,
0.12
),

eyeMat
);

leftEye.position.set(
-0.18,
2.72,
0.51
);

len.add(leftEye);

const rightEye = leftEye.clone();

rightEye.position.x = 0.18;

len.add(rightEye);

// corbata

const tie = new THREE.Mesh(

new THREE.BoxGeometry(
0.15,
0.7,
0.08
),

new THREE.MeshStandardMaterial({
color:0xffd700
})
);

tie.position.set(
0,
1.25,
0.4
);

len.add(tie);

// brazos

function makeArm(side){

const arm = new THREE.Mesh(

new THREE.BoxGeometry(
0.35,
1,
0.35
),

new THREE.MeshStandardMaterial({
color:0x222222
})
);

arm.position.set(
side*0.8,
1.45,
0
);

return arm;
}

len.add(makeArm(-1));
len.add(makeArm(1));

// piernas

function makeLeg(side){

const leg = new THREE.Mesh(

new THREE.BoxGeometry(
0.4,
1,
0.4
),

new THREE.MeshStandardMaterial({
color:0x2a2a2a
})
);

leg.position.set(
side*0.25,
0.5,
0
);

return leg;
}

len.add(makeLeg(-1));
len.add(makeLeg(1));

scene.add(len);

// =====================================
// PISO
// =====================================

const floorCanvas =
document.createElement("canvas");

floorCanvas.width = 256;
floorCanvas.height = 256;

const ctx =
floorCanvas.getContext("2d");

ctx.fillStyle = "#8a6a20";
ctx.fillRect(0,0,256,256);

for(let i=0;i<12000;i++){

ctx.fillStyle =
Math.random()>0.5
? "rgba(0,0,0,0.10)"
: "rgba(255,255,255,0.02)";

ctx.fillRect(
Math.random()*256,
Math.random()*256,
1,
1
);
}

const floorTex =
new THREE.CanvasTexture(floorCanvas);

floorTex.wrapS =
THREE.RepeatWrapping;

floorTex.wrapT =
THREE.RepeatWrapping;

floorTex.repeat.set(140,140);

const floor = new THREE.Mesh(

new THREE.PlaneGeometry(
5000,
5000
),

new THREE.MeshStandardMaterial({
map:floorTex
})
);

floor.rotation.x =
-Math.PI/2;

floor.receiveShadow = true;

scene.add(floor);

// =====================================
// TECHO
// =====================================

const ceiling = new THREE.Mesh(

new THREE.PlaneGeometry(
5000,
5000
),

new THREE.MeshStandardMaterial({
color:0xd8c88d
})
);

ceiling.rotation.x =
Math.PI/2;

ceiling.position.y = 6;

scene.add(ceiling);

// =====================================
// LUCES
// =====================================

scene.add(

new THREE.AmbientLight(
0xffffff,
0.18
)

);

const lights = [];

// =====================================
// CHUNKS
// =====================================

const chunkSize = 60;

const chunks = {};

function createWall(
x,y,z,
w,h,d,
group
){

const wall = new THREE.Mesh(

new THREE.BoxGeometry(
w,h,d
),

new THREE.MeshStandardMaterial({
color:0xb89b45
})
);

wall.position.set(x,y,z);

wall.castShadow = true;
wall.receiveShadow = true;

wall.userData = {
w:w,
d:d
};

scene.add(wall);

group.add(wall);

return wall;
}

// =====================================
// GENERACIÓN BACKROOMS
// =====================================

function generateChunk(cx,cz){

const key = `${cx},${cz}`;

if(chunks[key]) return;

const group = new THREE.Group();

group.userData.walls = [];

chunks[key] = group;

const bx = cx * chunkSize;
const bz = cz * chunkSize;

// paredes coherentes

for(let i=0;i<16;i++){

const horizontal =
Math.random()>0.5;

const wall = createWall(

bx + (Math.random()-0.5)*chunkSize,
3,
bz + (Math.random()-0.5)*chunkSize,

horizontal ? 28 : 2,
6,
horizontal ? 2 : 28,

group
);

group.userData.walls.push(wall);
}

// columnas

for(let i=0;i<6;i++){

const column = new THREE.Mesh(

new THREE.BoxGeometry(
4,
6,
4
),

new THREE.MeshStandardMaterial({
color:0x8f762f
})
);

column.position.set(

bx + (Math.random()-0.5)*chunkSize,
3,
bz + (Math.random()-0.5)*chunkSize

);

column.castShadow = true;
column.receiveShadow = true;

column.userData = {
w:4,
d:4
};

scene.add(column);

group.add(column);

group.userData.walls.push(column);
}

// lámparas

for(let i=0;i<4;i++){

const x =
bx + (Math.random()-0.5)*chunkSize;

const z =
bz + (Math.random()-0.5)*chunkSize;

const light =
new THREE.PointLight(
0xfff0c2,
1.2,
20
);

light.position.set(
x,
5.5,
z
);

scene.add(light);

group.add(light);

lights.push(light);

const lamp = new THREE.Mesh(

new THREE.BoxGeometry(
5,
0.15,
2
),

new THREE.MeshBasicMaterial({
color:0xffffee
})
);

lamp.position.copy(
light.position
);

scene.add(lamp);

group.add(lamp);
}
}

// =====================================
// DESCARGAR CHUNKS
// =====================================

function unloadFarChunks(px,pz){

for(const key in chunks){

const [cx,cz] =
key.split(",").map(Number);

const dx = cx - px;
const dz = cz - pz;

if(
Math.abs(dx)>2 ||
Math.abs(dz)>2
){

const group =
chunks[key];

group.traverse(obj=>{

scene.remove(obj);

if(obj.geometry)
obj.geometry.dispose();

if(obj.material){

if(Array.isArray(obj.material)){

obj.material.forEach(
m=>m.dispose()
);
}
else{
obj.material.dispose();
}
}
});

delete chunks[key];
}
}
}

// =====================================
// CONTROLES
// =====================================

const keys = {};

window.addEventListener(
"keydown",
e=>{

keys[e.key.toLowerCase()] = true;

});

window.addEventListener(
"keyup",
e=>{

keys[e.key.toLowerCase()] = false;

});

// =====================================
// POINTER LOCK
// =====================================

let yaw = 0;
let pitch = 0;

renderer.domElement.addEventListener(
"click",
()=>{

renderer.domElement.requestPointerLock();

});

window.addEventListener(
"mousemove",
e=>{

if(
document.pointerLockElement
=== renderer.domElement
){

yaw -= e.movementX * 0.002;

pitch -= e.movementY * 0.002;

pitch = Math.max(
-1,
Math.min(1,pitch)
);
}
});

// =====================================
// STAMINA
// =====================================

let stamina = 100;

const staminaBar =
document.getElementById(
"stamina"
);

// =====================================
// BATERÍA
// =====================================

let battery = 100;

const batteryBar =
document.getElementById(
"battery"
);

// =====================================
// CELULAR
// =====================================

let flashlightOn = true;

const flashlight =
new THREE.SpotLight(

0xffffff,
2.7,
28,
Math.PI/8,
0.4

);

scene.add(flashlight);
scene.add(flashlight.target);

window.addEventListener(
"keydown",
e=>{

if(e.key.toLowerCase()==="f"){

flashlightOn =
!flashlightOn;

flashlight.visible =
flashlightOn;
}
});

// =====================================
// BACTERIA
// =====================================

const bacteria =
new THREE.Group();

const core =
new THREE.Mesh(

new THREE.SphereGeometry(
1.6,
10,
10
),

new THREE.MeshStandardMaterial({
color:0x080808
})
);

bacteria.add(core);

// patas

for(let i=0;i<8;i++){

const leg =
new THREE.Mesh(

new THREE.CylinderGeometry(
0.05,
0.08,
5
),

new THREE.MeshStandardMaterial({
color:0x080808
})
);

leg.position.set(

(Math.random()-0.5)*3,
-2,
(Math.random()-0.5)*3

);

leg.rotation.z =
Math.random()*2;

bacteria.add(leg);
}

bacteria.position.set(
20,
4,
20
);

scene.add(bacteria);

// =====================================
// COLISIONES
// =====================================

function checkCollision(x,z){

for(const key in chunks){

const walls =
chunks[key].userData.walls;

for(const wall of walls){

const dx =
Math.abs(
x - wall.position.x
);

const dz =
Math.abs(
z - wall.position.z
);

const limitX =
wall.userData.w/2
+ player.radius;

const limitZ =
wall.userData.d/2
+ player.radius;

if(
dx < limitX &&
dz < limitZ
){
return true;
}
}
}

return false;
}

// =====================================
// UPDATE
// =====================================

function update(){

// procedural

const currentChunkX =
Math.floor(
player.x/chunkSize
);

const currentChunkZ =
Math.floor(
player.z/chunkSize
);

for(let x=-1;x<=1;x++){

for(let z=-1;z<=1;z++){

generateChunk(
currentChunkX + x,
currentChunkZ + z
);
}
}

unloadFarChunks(
currentChunkX,
currentChunkZ
);

// movimiento

let speed = 0.09;

const moving =

keys["w"] ||
keys["a"] ||
keys["s"] ||
keys["d"];

if(
keys["shift"] &&
stamina > 0 &&
moving
){

speed = 0.16;

stamina -= 0.4;
}
else{

stamina += 0.25;
}

stamina = Math.max(
0,
Math.min(100,stamina)
);

staminaBar.style.width =
stamina + "%";

// batería

if(flashlightOn){

battery -= 0.01;
}
else{

battery += 0.02;
}

battery = Math.max(
0,
Math.min(100,battery)
);

batteryBar.style.width =
battery + "%";

if(battery <= 0){

flashlight.visible = false;
}

// movimiento suave

let mx = 0;
let mz = 0;

if(keys["w"]){

mx += Math.sin(yaw)*speed;
mz += Math.cos(yaw)*speed;
}

if(keys["s"]){

mx -= Math.sin(yaw)*speed;
mz -= Math.cos(yaw)*speed;
}

if(keys["a"]){

mx += Math.sin(
yaw + Math.PI/2
)*speed;

mz += Math.cos(
yaw + Math.PI/2
)*speed;
}

if(keys["d"]){

mx += Math.sin(
yaw - Math.PI/2
)*speed;

mz += Math.cos(
yaw - Math.PI/2
)*speed;
}

const nextX =
player.x + mx;

const nextZ =
player.z + mz;

if(
!checkCollision(
nextX,
player.z
)
){

player.x = nextX;
}

if(
!checkCollision(
player.x,
nextZ
)
){

player.z = nextZ;
}

// len

len.position.set(
player.x,
0,
player.z
);

len.rotation.y = yaw;

// animación caminar

if(moving){

len.position.y =
Math.sin(Date.now()*0.01)*0.08;
}

// cámara

const camX =
player.x -
Math.sin(yaw)*5;

const camZ =
player.z -
Math.cos(yaw)*5;

camera.position.x +=
(camX-camera.position.x)
*0.08;

camera.position.z +=
(camZ-camera.position.z)
*0.08;

camera.position.y +=
(3-camera.position.y)
*0.08;

camera.lookAt(
player.x,
2 + pitch,
player.z
);

// linterna

flashlight.position.copy(
camera.position
);

flashlight.target.position.set(

player.x + Math.sin(yaw)*10,
2,
player.z + Math.cos(yaw)*10

);

// bacteria

const dx =
player.x -
bacteria.position.x;

const dz =
player.z -
bacteria.position.z;

const dist =
Math.sqrt(dx*dx + dz*dz);

if(dist < 40){

bacteria.lookAt(
player.x,
4,
player.z
);

if(dist > 10){

bacteria.position.x +=
dx*0.002;

bacteria.position.z +=
dz*0.002;
}

if(dist < 18){

vhs.style.opacity =
0.18 + Math.random()*0.15;
}
}
else{

vhs.style.opacity =
0.05 + Math.random()*0.05;
}

// luces

for(const l of lights){

if(Math.random()<0.0015){

l.intensity =
Math.random()*0.5;
}
else{

l.intensity +=
(1-l.intensity)*0.03;
}
}
}

// =====================================
// LOOP
// =====================================

function animate(){

requestAnimationFrame(
animate
);

update();

renderer.render(
scene,
camera
);
}

animate();

// =====================================
// RESIZE
// =====================================

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);
});

</script>

</body>
</html>
