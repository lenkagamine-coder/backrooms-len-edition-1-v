<script>

// =====================================
// ESCENA
// =====================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x66551f);
scene.fog = new THREE.FogExp2(0x66551f,0.02);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

// =====================================
// VHS
// =====================================

const vhs = document.getElementById("vhs");

setInterval(()=>{

vhs.style.opacity = 0.05 + Math.random()*0.04;

},120);

// =====================================
// PLAYER
// =====================================

const player = {
x:0,
y:0,
z:0,
radius:1
};

// =====================================
// LEN LOWPOLY
// =====================================

const len = new THREE.Group();

const body = new THREE.Mesh(
new THREE.BoxGeometry(1,1.5,0.6),
new THREE.MeshStandardMaterial({
color:0xffffff
})
);

body.position.y = 1.6;
body.castShadow = true;
len.add(body);

const head = new THREE.Mesh(
new THREE.BoxGeometry(0.9,0.9,0.9),
new THREE.MeshStandardMaterial({
color:0xffd8b5
})
);

head.position.y = 2.8;
head.castShadow = true;
len.add(head);

const hair = new THREE.Mesh(
new THREE.BoxGeometry(1,0.5,1),
new THREE.MeshStandardMaterial({
color:0xf2cf4a
})
);

hair.position.y = 3.2;
hair.castShadow = true;
len.add(hair);

const tie = new THREE.Mesh(
new THREE.BoxGeometry(0.15,0.8,0.1),
new THREE.MeshStandardMaterial({
color:0xffd83d
})
);

tie.position.set(0,1.4,0.31);
len.add(tie);

scene.add(len);

// =====================================
// TEXTURA PISO
// =====================================

const floorCanvas = document.createElement("canvas");
floorCanvas.width = 128;
floorCanvas.height = 128;

const fctx = floorCanvas.getContext("2d");

fctx.fillStyle = "#7d6228";
fctx.fillRect(0,0,128,128);

for(let i=0;i<5000;i++){

fctx.fillStyle = Math.random()>0.5
? "rgba(0,0,0,0.14)"
: "rgba(255,255,255,0.02)";

fctx.fillRect(
Math.random()*128,
Math.random()*128,
1,
1
);
}

const floorTex = new THREE.CanvasTexture(floorCanvas);

floorTex.wrapS = THREE.RepeatWrapping;
floorTex.wrapT = THREE.RepeatWrapping;

floorTex.repeat.set(120,120);

// =====================================
// PISO
// =====================================

const floor = new THREE.Mesh(
new THREE.PlaneGeometry(4000,4000),
new THREE.MeshStandardMaterial({
map:floorTex,
roughness:1
})
);

floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;

scene.add(floor);

// =====================================
// TECHO
// =====================================

const ceiling = new THREE.Mesh(
new THREE.PlaneGeometry(4000,4000),
new THREE.MeshStandardMaterial({
color:0xded7b8
})
);

ceiling.rotation.x = Math.PI/2;
ceiling.position.y = 6;

scene.add(ceiling);

// =====================================
// LUCES
// =====================================

scene.add(new THREE.AmbientLight(
0xffffff,
0.16
));

const lights = [];

// =====================================
// CHUNKS
// =====================================

const chunkSize = 60;
const chunks = {};

function addLight(x,z,group){

const light = new THREE.PointLight(
0xffefc2,
0.9,
18
);

light.position.set(x,5.7,z);

light.castShadow = false;

scene.add(light);
group.add(light);

lights.push(light);

const lamp = new THREE.Mesh(
new THREE.BoxGeometry(5,0.1,2),
new THREE.MeshBasicMaterial({
color:0xffffee
})
);

lamp.position.copy(light.position);

scene.add(lamp);
group.add(lamp);
}

function createWall(x,y,z,w,h,d,group){

const wall = new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({
color:0xb69a4d
})
);

wall.position.set(x,y,z);

wall.castShadow = true;
wall.receiveShadow = true;

wall.userData = {
w:w,
d:d
};

scene.add(wall);
group.add(wall);

return wall;
}

// =====================================
// GENERADOR BACKROOMS
// =====================================

function generateChunk(cx,cz){

const key = `${cx},${cz}`;

if(chunks[key]) return;

const group = new THREE.Group();

group.userData.walls = [];
group.userData.lights = [];

chunks[key] = group;

const bx = cx * chunkSize;
const bz = cz * chunkSize;

// corredores más coherentes

for(let i=0;i<12;i++){

const horizontal = Math.random()>0.5;

const wall = createWall(

bx + (Math.random()-0.5)*chunkSize,
3,
bz + (Math.random()-0.5)*chunkSize,

horizontal ? 24 : 2,
6,
horizontal ? 2 : 24,

group
);

group.userData.walls.push(wall);
}

// columnas

for(let i=0;i<4;i++){

const column = new THREE.Mesh(

new THREE.BoxGeometry(4,6,4),

new THREE.MeshStandardMaterial({
color:0x9b8137
})
);

column.position.set(
bx + (Math.random()-0.5)*chunkSize,
3,
bz + (Math.random()-0.5)*chunkSize
);

column.castShadow = true;
column.receiveShadow = true;

column.userData = {
w:4,
d:4
};

scene.add(column);

group.add(column);
group.userData.walls.push(column);
}

// puertas

for(let i=0;i<2;i++){

const door = new THREE.Mesh(

new THREE.BoxGeometry(4,5,0.3),

new THREE.MeshStandardMaterial({
color:0x593411
})
);

door.position.set(
bx + (Math.random()-0.5)*chunkSize,
2.5,
bz + (Math.random()-0.5)*chunkSize
);

scene.add(door);
group.add(door);
}

// luces

for(let i=0;i<3;i++){

addLight(

bx + (Math.random()-0.5)*chunkSize,
bz + (Math.random()-0.5)*chunkSize,

group
);
}
}

// =====================================
// DESCARGAR CHUNKS
// =====================================

function unloadFarChunks(px,pz){

for(const key in chunks){

const [cx,cz] = key.split(",").map(Number);

const dx = cx - px;
const dz = cz - pz;

if(Math.abs(dx)>2 || Math.abs(dz)>2){

const group = chunks[key];

group.traverse(obj=>{

scene.remove(obj);

if(obj.geometry) obj.geometry.dispose();

if(obj.material){

if(Array.isArray(obj.material)){

obj.material.forEach(m=>m.dispose());
}
else{
obj.material.dispose();
}
}
});

delete chunks[key];
}
}
}

// =====================================
// CONTROLES
// =====================================

const keys = {};

window.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()] = false;
});

// =====================================
// MOUSE LOOK
// =====================================

let yaw = 0;
let pitch = 0;

renderer.domElement.addEventListener("click",()=>{

renderer.domElement.requestPointerLock();
});

window.addEventListener("mousemove",e=>{

if(document.pointerLockElement === renderer.domElement){

yaw -= e.movementX * 0.002;

pitch -= e.movementY * 0.002;

pitch = Math.max(
-1,
Math.min(1,pitch)
);
}
});

// =====================================
// STAMINA
// =====================================

let stamina = 100;

const staminaBar =
document.getElementById("stamina");

// =====================================
// CELULAR
// =====================================

let flashlightOn = true;

const flashlight = new THREE.SpotLight(
0xffffff,
2.5,
25,
Math.PI/8,
0.4
);

scene.add(flashlight);
scene.add(flashlight.target);

window.addEventListener("keydown",e=>{

if(e.key.toLowerCase()==="f"){

flashlightOn = !flashlightOn;

flashlight.visible = flashlightOn;
}
});

// =====================================
// BACTERIA
// =====================================

const bacteria = new THREE.Group();

const core = new THREE.Mesh(

new THREE.SphereGeometry(1.5,10,10),

new THREE.MeshStandardMaterial({
color:0x090909
})
);

bacteria.add(core);

for(let i=0;i<8;i++){

const leg = new THREE.Mesh(

new THREE.CylinderGeometry(
0.05,
0.08,
5
),

new THREE.MeshStandardMaterial({
color:0x090909
})
);

leg.position.set(
(Math.random()-0.5)*2,
-2,
(Math.random()-0.5)*2
);

leg.rotation.z = Math.random()*2;

bacteria.add(leg);
}

bacteria.position.set(25,4,25);

scene.add(bacteria);

// =====================================
// COLISIONES
// =====================================

function checkCollision(x,z){

for(const key in chunks){

const walls = chunks[key].userData.walls;

for(const wall of walls){

const dx =
Math.abs(x - wall.position.x);

const dz =
Math.abs(z - wall.position.z);

const limitX =
wall.userData.w/2 + player.radius;

const limitZ =
wall.userData.d/2 + player.radius;

if(dx < limitX && dz < limitZ){

return true;
}
}
}

return false;
}

// =====================================
// UPDATE
// =====================================

function update(){

// procedural

const currentChunkX =
Math.floor(player.x / chunkSize);

const currentChunkZ =
Math.floor(player.z / chunkSize);

for(let x=-1;x<=1;x++){
for(let z=-1;z<=1;z++){

generateChunk(
currentChunkX + x,
currentChunkZ + z
);
}
}

unloadFarChunks(
currentChunkX,
currentChunkZ
);

// movimiento

let speed = 0.08;

const moving =

keys["w"] ||
keys["a"] ||
keys["s"] ||
keys["d"];

if(keys["shift"] &&
stamina > 0 &&
moving){

speed = 0.14;

stamina -= 0.45;
}
else{

stamina += 0.25;
}

stamina = Math.max(
0,
Math.min(100,stamina)
);

staminaBar.style.width =
stamina + "%";

let mx = 0;
let mz = 0;

if(keys["w"]){

mx += Math.sin(yaw)*speed;
mz += Math.cos(yaw)*speed;
}

if(keys["s"]){

mx -= Math.sin(yaw)*speed;
mz -= Math.cos(yaw)*speed;
}

if(keys["a"]){

mx += Math.sin(yaw + Math.PI/2)*speed;
mz += Math.cos(yaw + Math.PI/2)*speed;
}

if(keys["d"]){

mx += Math.sin(yaw - Math.PI/2)*speed;
mz += Math.cos(yaw - Math.PI/2)*speed;
}

// colisiones reales

const nextX = player.x + mx;
const nextZ = player.z + mz;

if(!checkCollision(nextX,player.z)){

player.x = nextX;
}

if(!checkCollision(player.x,nextZ)){

player.z = nextZ;
}

// personaje

len.position.set(
player.x,
0,
player.z
);

len.rotation.y = yaw;

// cámara FPS suave

const camX =
player.x - Math.sin(yaw)*5;

const camZ =
player.z - Math.cos(yaw)*5;

const camY =
3 + Math.sin(Date.now()*0.01)*0.02;

camera.position.x +=
(camX - camera.position.x)*0.08;

camera.position.z +=
(camZ - camera.position.z)*0.08;

camera.position.y +=
(camY - camera.position.y)*0.08;

camera.lookAt(
player.x,
2 + pitch,
player.z
);

// celular

flashlight.position.copy(
camera.position
);

flashlight.target.position.set(

player.x + Math.sin(yaw)*10,
2,
player.z + Math.cos(yaw)*10
);

// bacteria mejorada

const dx =
player.x - bacteria.position.x;

const dz =
player.z - bacteria.position.z;

const dist =
Math.sqrt(dx*dx + dz*dz);

if(dist < 45){

bacteria.lookAt(
player.x,
4,
player.z
);

if(dist > 10){

bacteria.position.x += dx*0.0025;
bacteria.position.z += dz*0.0025;
}

if(dist < 18){

vhs.style.opacity =
0.15 + Math.random()*0.15;
}
}
else{

vhs.style.opacity =
0.05 + Math.random()*0.04;
}

// parpadeo luces

for(const l of lights){

if(Math.random()<0.0015){

l.intensity =
Math.random()*0.4;
}
else{

l.intensity +=
(0.9 - l.intensity)*0.03;
}
}
}

// =====================================
// LOOP
// =====================================

function animate(){

requestAnimationFrame(animate);

update();

renderer.render(
scene,
camera
);
}

animate();

// =====================================
// RESIZE
// =====================================

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);
});

</script>
